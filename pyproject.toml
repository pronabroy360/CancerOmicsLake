[project]
name = "canceromicslake"
version = "0.1.0"
description = "TCGA + GTEx bioinformatics data engineering lakehouse and graph pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "fastapi>=0.111.0",
  "polars>=1.0.0",
  "numpy>=1.26.0",
  "prefect>=2.19.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "streamlit>=1.35.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
