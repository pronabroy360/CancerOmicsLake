project:
  name: CancerOmicsLake
  version: "0.1"
  mode: open_access

tcga:
  projects:
    - TCGA-BRCA
    - TCGA-LUAD
    - TCGA-COAD
  data_categories:
    - Transcriptome Profiling
    - Simple Nucleotide Variation
    - Clinical
    - Biospecimen
  access:
    type: open
  metadata_only: true
  max_files_per_project: 200
  data_types: null
  experimental_strategies: null
  workflow_types: null
  use_stub_on_error: true
  require_live_gdc: false
  download_caps_by_project:
    TCGA-BRCA:
      expression: 25
      mutations: 10
    TCGA-LUAD:
      expression: 25
      mutations: 10
    TCGA-COAD:
      expression: 25
      mutations: 10

gtex:
  version: v8
  tissues:
    - Breast - Mammary Tissue
    - Lung
    - Colon - Transverse
    - Colon - Sigmoid

storage:
  format: parquet
  database: duckdb
  duckdb_path: outputs/canceromicslake.duckdb

quality:
  gene_mapping_rate_threshold: 0.98
  fail_on_controlled_access: true

gdc_api:
  base_url: https://api.gdc.cancer.gov
  files_endpoint: /files
  request_timeout_sec: 60
  retry_count: 2
  retry_backoff_sec: 1.5
  audit_output_path: outputs/reports/gdc_ingestion_audit.json
