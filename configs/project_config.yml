project:
  name: CancerOmicsLake
  version: "0.1"
  mode: open_access

tcga:
  projects:
    - TCGA-BRCA
    - TCGA-LUAD
    - TCGA-COAD
  data_categories:
    - Transcriptome Profiling
    - Simple Nucleotide Variation
    - Clinical
    - Biospecimen
  access:
    type: open
  metadata_only: true
  max_files_per_project: 200
  data_types: null
  experimental_strategies: null
  workflow_types: null
  use_stub_on_error: true
  require_live_gdc: false
  download_caps_by_project:
    TCGA-BRCA:
      expression: 25
      mutations: 10
    TCGA-LUAD:
      expression: 25
      mutations: 10
    TCGA-COAD:
      expression: 25
      mutations: 10

gtex:
  version: v8
  metadata_only: true
  sample_cap_per_tissue: 50
  download_base_url: https://storage.googleapis.com/adult-gtex/bulk-gex/v8/rna-seq/tpms-by-tissue
  sample_attributes_url: https://storage.googleapis.com/adult-gtex/annotations/v8/metadata-files/GTEx_Analysis_v8_Annotations_SampleAttributesDS.txt
  tissues:
    - Breast - Mammary Tissue
    - Lung
    - Colon - Transverse
    - Colon - Sigmoid
  tissue_files:
    Breast - Mammary Tissue: gene_tpm_2017-06-05_v8_breast_mammary_tissue.gct.gz
    Lung: gene_tpm_2017-06-05_v8_lung.gct.gz
    Colon - Transverse: gene_tpm_2017-06-05_v8_colon_transverse.gct.gz
    Colon - Sigmoid: gene_tpm_2017-06-05_v8_colon_sigmoid.gct.gz

storage:
  format: parquet
  database: duckdb
  duckdb_path: outputs/canceromicslake.duckdb

quality:
  gene_mapping_rate_threshold: 0.98
  fail_on_controlled_access: true

gdc_api:
  base_url: https://api.gdc.cancer.gov
  files_endpoint: /files
  request_timeout_sec: 60
  retry_count: 2
  retry_backoff_sec: 1.5
  audit_output_path: outputs/reports/gdc_ingestion_audit.json
