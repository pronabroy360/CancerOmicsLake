version: 2

models:
  - name: gold_cohort_summary
    columns:
      - name: tcga_project_count
        tests:
          - not_null
      - name: tcga_sample_count
        tests:
          - not_null
      - name: gene_count
        tests:
          - not_null

  - name: gold_mutation_frequency_by_gene
    columns:
      - name: gene_symbol
        tests:
          - not_null
      - name: cancer_type
        tests:
          - not_null
      - name: mutation_frequency
        tests:
          - not_null
      - name: mutation_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['protein_altering_only']

  - name: gold_mutation_frequency_by_cancer
    columns:
      - name: cancer_type
        tests:
          - not_null
          - unique
      - name: mutation_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['protein_altering_only']

  - name: gold_tumor_vs_normal_expression
    columns:
      - name: gene_symbol
        tests:
          - not_null
      - name: cancer_type
        tests:
          - not_null
      - name: sample_count_tumor
        tests:
          - not_null
      - name: sample_count_normal
        tests:
          - not_null

  - name: gold_batch_effect_sensitivity
    columns:
      - name: cancer_type
        tests:
          - not_null
      - name: gene_symbol
        tests:
          - not_null
      - name: percentile_delta
        tests:
          - not_null
      - name: robust_z_delta
        tests:
          - not_null
      - name: support_tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'moderate', 'limited']
      - name: sensitivity_direction
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['rank_up', 'rank_down', 'stable']
      - name: batch_method
        tests:
          - not_null

  - name: gold_reference_triangulation
    columns:
      - name: cancer_type
        tests:
          - not_null
      - name: gene_symbol
        tests:
          - not_null
      - name: reference_concordance
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['concordant_up', 'concordant_down', 'concordant_stable', 'reference_sensitive', 'discordant']
      - name: tcga_normal_support_tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'moderate', 'limited']
      - name: reference_stability_score
        tests:
          - not_null

  - name: gold_candidate_gene_priority
    columns:
      - name: cancer_type
        tests:
          - not_null
      - name: gene_symbol
        tests:
          - not_null
      - name: priority_score
        tests:
          - not_null
      - name: priority_tier
        tests:
          - not_null

  - name: gold_cancer_gene_evidence_confidence
    columns:
      - name: cancer_type
        tests:
          - not_null
      - name: gene_symbol
        tests:
          - not_null
      - name: overall_confidence
        tests:
          - not_null
      - name: confidence_tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'moderate', 'limited', 'low']
      - name: batch_effect_risk
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'elevated', 'not_applicable']
      - name: batch_concordance
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['concordant', 'inconclusive', 'discordant', 'unavailable', 'not_applicable']
      - name: batch_sensitivity_confidence
        tests:
          - not_null

  - name: gold_graph_nodes
    columns:
      - name: node_id
        tests:
          - not_null
      - name: node_label
        tests:
          - not_null

  - name: gold_graph_edges
    columns:
      - name: edge_id
        tests:
          - not_null
      - name: source_node_id
        tests:
          - not_null
      - name: target_node_id
        tests:
          - not_null
      - name: edge_type
        tests:
          - not_null
