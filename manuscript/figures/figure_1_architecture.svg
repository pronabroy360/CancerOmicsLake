<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330">
<style>text{font-family:Georgia,serif}.title{font-size:24px;font-weight:700;fill:#17343a}.stage{font-size:13px;font-weight:700}.desc{font-size:12px}.arrow{stroke:#c1773f;stroke-width:3;fill:none}</style>
<rect width="100%" height="100%" fill="#fbfaf4"/>
<text x="32" y="42" class="title">CancerOmicsLake evidence flow</text>
<text x="32" y="66" font-size="12" fill="#52676b">Open-access inputs become aggregate, traceable research evidence through explicit quality boundaries.</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c1773f"/></marker></defs>
<rect x="32" y="112" width="216" height="126" rx="8" fill="#dbe8cc"/>
<text x="48" y="144" class="stage" fill="#17343a">PUBLIC SOURCES</text>
<text x="48" y="174" class="desc" fill="#17343a">GDC / GTEx / recount3</text>
<text x="48" y="194" class="desc" fill="#17343a">Reactome pathways</text>
<path d="M 252 175 L 271 175" class="arrow" marker-end="url(#arrow)"/>
<rect x="276" y="112" width="216" height="126" rx="8" fill="#b8d7c5"/>
<text x="292" y="144" class="stage" fill="#17343a">BRONZE</text>
<text x="292" y="174" class="desc" fill="#17343a">Immutable files + checksums</text>
<text x="292" y="194" class="desc" fill="#17343a">Source provenance</text>
<path d="M 496 175 L 515 175" class="arrow" marker-end="url(#arrow)"/>
<rect x="520" y="112" width="216" height="126" rx="8" fill="#72b5ad"/>
<text x="536" y="144" class="stage" fill="#17343a">SILVER</text>
<text x="536" y="174" class="desc" fill="#17343a">Typed samples, genes,</text>
<text x="536" y="194" class="desc" fill="#17343a">expression, mutations</text>
<path d="M 740 175 L 759 175" class="arrow" marker-end="url(#arrow)"/>
<rect x="764" y="112" width="216" height="126" rx="8" fill="#287d82"/>
<text x="780" y="144" class="stage" fill="#ffffff">GOLD</text>
<text x="780" y="174" class="desc" fill="#ffffff">Research marts + ablation</text>
<text x="780" y="194" class="desc" fill="#ffffff">Quality evidence</text>
<path d="M 984 175 L 1003 175" class="arrow" marker-end="url(#arrow)"/>
<rect x="1008" y="112" width="216" height="126" rx="8" fill="#173f4a"/>
<text x="1024" y="144" class="stage" fill="#ffffff">RESEARCH SURFACES</text>
<text x="1024" y="174" class="desc" fill="#ffffff">DuckDB / dbt / API</text>
<text x="1024" y="194" class="desc" fill="#ffffff">Dashboard / graph</text>
<text x="32" y="286" font-size="12" fill="#52676b">Compliance boundary: controlled-access data and individual identifiers are excluded from public release surfaces.</text>
</svg>