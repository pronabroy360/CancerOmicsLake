services:
  dbt:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app

  api:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
